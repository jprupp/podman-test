name: podman-test
version: 0.1.0
synopsis: Podman containers for tests, in parallel, reached through Unix sockets
description: |
  Run the services that a test needs, such as a database or a node, in
  rootless Podman containers, from any test framework. Every run of the
  tests has its own containers and its own folder of Unix sockets, so test
  processes run in parallel without sharing ports. A service that listens
  on a Unix socket is reached directly; one that only listens on TCP is
  bridged to a socket; TCP ports on the loopback interface are there when
  a client needs them. Containers that a dead run left behind are removed
  by the next one.
category: Testing
author: JP Rupp
maintainer: jprupp@protonmail.ch
copyright: (c) 2026 JP Rupp
license: MIT
license-file: LICENSE
github: jprupp/podman-test
stability: experimental
extra-source-files:
  - README.md
  - CHANGELOG.md

language: GHC2021
default-extensions:
  - DuplicateRecordFields
  - LambdaCase
  - NoFieldSelectors
  - OverloadedRecordDot

# hpack joins these options onto one line of the generated cabal file, which
# is longer than 120 columns. hpack has no way to break it, so it stays long.
ghc-options:
  - -Wall
  - -Wcompat
  - -Widentities
  - -Wincomplete-record-updates
  - -Wincomplete-uni-patterns
  - -Wredundant-constraints

dependencies:
  - base >= 4.18 && < 5

library:
  source-dirs: src
  exposed-modules:
    - Test.Podman
    - Test.Podman.Command
    - Test.Podman.Image
    - Test.Podman.Run
  dependencies:
    - bytestring >= 0.11 && < 0.13
    - containers >= 0.6 && < 0.8
    - cryptohash-sha256 >= 0.11 && < 0.12
    - directory >= 1.3 && < 1.4
    - filepath >= 1.4 && < 1.6
    - network >= 3.1 && < 3.3
    - process >= 1.6 && < 1.7
    - unix >= 2.8 && < 2.9

tests:
  spec:
    main: Spec.hs
    source-dirs: test
    ghc-options: -threaded -rtsopts "-with-rtsopts=-N4 -M1g"
    build-tools:
      - hspec-discover
    dependencies:
      - podman-test
      - async
      - bytestring
      - directory
      - filepath
      - hspec >= 2.10
      - network
      - process
      - unix
